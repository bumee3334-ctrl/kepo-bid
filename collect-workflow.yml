name: 공고 수집

on:
  schedule:
    # 시간은 UTC 기준입니다. 한국 시간(KST)으로는 각각 08:30, 12:30, 17:30 입니다.
    # (GitHub 사정으로 몇 분~수십 분 늦게 실행될 수 있어요)
    - cron: '30 23 * * *'
    - cron: '30 3 * * *'
    - cron: '30 8 * * *'
  workflow_dispatch:   # 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 공고 수집
        id: collect
        continue-on-error: true
        env:
          KEPCO_API_KEY: ${{ secrets.KEPCO_API_KEY }}
        run: node scripts/collect.mjs

      - name: 변경된 데이터 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bids.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "공고 데이터 갱신"
            git push
          fi

      - name: 수집 실패 표시
        if: steps.collect.outcome == 'failure'
        run: |
          echo "수집 단계에서 오류가 있었어요. 위 '공고 수집' 단계의 로그를 확인해 주세요."
          exit 1
