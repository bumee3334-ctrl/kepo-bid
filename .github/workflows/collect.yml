name: 공고 수집

# 자동 실행 없이, 직접 눌렀을 때만 실행됩니다. (Actions 탭 → 공고 수집 → Run workflow)
on:
  workflow_dispatch:
    inputs:
      begin:
        description: '시작일 (공고일 기준, 예: 2021-09-21). 비워두면 오늘부터 5년 전'
        required: false
        default: ''
      end:
        description: '종료일 (공고일 기준, 예: 2026-09-21). 비워두면 오늘부터 29일 뒤'
        required: false
        default: ''
      keyword:
        description: '검색어 (입찰건명에 들어갈 단어, 예: 일산). 비워두면 전체 공고'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 공고 수집
        id: collect
        continue-on-error: true
        env:
          KEPCO_API_KEY: ${{ secrets.KEPCO_API_KEY }}
          BEGIN_DATE: ${{ inputs.begin }}
          END_DATE: ${{ inputs.end }}
          KEYWORD: ${{ inputs.keyword }}
        run: node scripts/collect.mjs

      - name: 변경된 데이터 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "공고 데이터 갱신"
            git pull --rebase
            git push
          fi

      - name: 수집 실패 표시
        if: steps.collect.outcome == 'failure'
        run: |
          echo "수집 단계에서 오류가 있었어요. 위 '공고 수집' 단계의 로그를 확인해 주세요."
          exit 1
